name: KGA 3.0 Bulut Otomasyonu (Sabah Bülteni & Gün Sonu Raporu)

on:
  schedule:
    # 1. Sabah 09:22 TSİ (06:22 UTC) -> Günlük Bülten (Saat başı yoğunluğuna takılmamak için 09:22)
    - cron: '22 6 * * *'
    # 2. Gece 23:55 TSİ (20:55 UTC) -> Gün Sonu Kapanış ve Kasa Raporu
    - cron: '55 20 * * *'

  workflow_dispatch: # Manuel anlık tetikleme

jobs:
  kga_orchestrator:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları Yükle
        run: |
          pip install pdfplumber requests google-genai

      - name: KGA Görevini Çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '9082147299:AAEQubL7YIyr4NPS_MAoT02xixUjQ_RtiD0' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '664321983' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # UTC saatine göre sabah mı gece mi olduğunu anla
          CURRENT_HOUR=$(date -u +"%H")
          if [ "$CURRENT_HOUR" -ge 18 ] || [ "$CURRENT_HOUR" -le 2 ]; then
            echo "[*] Gece Kapanış Seansı: Gün Sonu Raporu çalıştırılıyor..."
            python run_kga_eod_report.py
          else
            echo "[*] Sabah Seansı: Günlük KGA Bülteni çalıştırılıyor..."
            python run_kga_cloud.py
          fi

      - name: Verileri ve Defteri Depoya Geri Kaydet (Kalıcı Hafıza)
        if: always()
        run: |
          git config --global user.name "KGA Autonomous AI"
          git config --global user.email "kga-bot@users.noreply.github.com"
          git add -A
          git commit -m "KGA 3.0 Günlük Rapor ve Kasa Defteri Güncellendi [skip ci]" || echo "Değişiklik yok"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:main || git push || echo "Push pas geçildi"
